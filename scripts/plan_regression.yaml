# plan_regression.yaml — utterances for scripts/plan_regression.py
#
# R: field report (2026-10) — "냉장고 가서 오이 집어 와/가져와" dropped the open about 1 in 10.
# A–H: the v2 open-vocabulary set the production prompt was measured on
#      (llm-router-test plan/v2/utterances.yaml, copied unchanged below).
#
# v2 테스트 발화 74개 — 열린 어휘·동사 20개·위치 규칙.
#
# expect 항목 (여러 개면 하나만 맞아도 통과):
#   {seq: [[verb, arg, ...], ...]}           동사 열이 정확히 일치 (strict). 인자 'a|b' 는 택일, '*' 는 무엇이든
#   {seq: [...], loose: true}                 seq 는 순서대로 포함되어야 하고, 그 밖의 줄은 move_to/open/close 만 허용
#   {reply: chat|none|confirm}
#   {infeasible: true, seq: [...], loose: true}  LLM 은 계획을 내야 하고(none 이면 실패), 검증기2 가 중단해야 함
#   {manual: true}                            자동 채점 불가 — 사람이 표에서 판단
# state: idle | running:<action> | awaiting_confirm:<요약>
#
# 위치 규칙 (프롬프트): 발화에 물건의 위치가 없으면 물건은 손 닿는 곳 → move_to 없음.
#   물건의 위치가 언급되면(…에서, …에 있는) 그곳으로 move_to 후 조작. 놓거나 넣을 목적지(…에)는 위치 언급이 아님.
#   닫힌 용기(냉장고·서랍·찬장)는 open → 동작 → close.

