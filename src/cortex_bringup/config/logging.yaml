# Console logging per node. Read by the launch files (logging_file:=/path to swap).
# Docker (docker/run.sh): this file is read from the host, so an edit applies when cortex is
# relaunched — no image rebuild. Without Docker: rebuild unless built with --symlink-install.
#
#   level   ROS log level: debug | info | warn | error | fatal (node value wins over the top one).
#           At info each node prints one startup line plus warnings/errors; warn hides the startup line.
#   events  opt-in event lines, "EVENT_NAME {json}". Not listed = silent. "all" = every topic.
#   record  topics published on /cortex/events for the session recorder, independent of the
#           console. "all" = everything, "" = none. Top-level value; a node may override it.
#
# Topics per node (default-on ones are listed below; the rest are commented out):
#   orchestrator_node  session   SESSION_START, SESSION_END (one voice command: utterance → outcome)
#                      plan      PLAN_STEP, PLAN_END, PLAN_CANCEL, PLAN_IGNORED, REWRITE, SCENARIO
#                      precheck  PRECHECK_CONFIG, PRECHECK_RESULT, PRECHECK_STATE
#                      subtask   SUBTASK_SENT, WAIT_IDLE, STUB_DISPATCH
#                      state     ROBOT_STATE
#                      config    VLA_PROMPT, TTS_WARMUP
#                      hold      HOLD_MONITOR (config / start / stop), HOLD_STATE (gripper state of
#                                the held object, on change), HOLD_STATS (share of each state per
#                                holding window), HOLD_UNKNOWN, HOLD_LOST
#   detector_node      config    YOLO_CONFIG (once at start)
#                      check     YOLO_CHECK (each answer + camera fps · infer Hz/ms · drops at that
#                                moment; the same answer repeated within 2 s is not printed)
#   stt_node           transcript STT_TRANSCRIPT
#                      session   STT_SESSION (stream start / restart / stop)
#   llm_node           request   LLM_REQUEST
#                      line      LLM_LINE_SKIPPED, LLM_LINE_BLOCKED
#                      timing    LLM_DONE
#   tts_node           say       TTS_SAY, TTS_CANCEL, TTS_PUBLISHED
#                      prefetch  TTS_PREFETCH
#   speaker_node       playback  SPEAKER_BARGE_IN
#   gui_bridge_node    client    GUI_CLIENT
#
# session_log: session_recorder_node writes one JSONL per voice command from /cortex/events
#   (so it sees what "record" publishes) plus a per-day sessions.csv index. Docker: docker/run.sh
#   mounts the host's CORTEX_LOG_DIR (default ~/cortex_logs) at the container's ~/cortex_logs.

level: info
record: all

session_log:
  enabled: true
  dir: ~/cortex_logs     # <dir>/YYYY-MM-DD/{sessions.csv, HHMMSS_<plan_id>.jsonl}
  keep_days: 14          # day folders older than this are deleted
  pre_roll_s: 5.0        # events from just before the utterance (transcript, STT state)
  post_roll_s: 2.0       # events right after SESSION_END (last TTS line)
  end_timeout_s: 120.0   # close a session that never got its SESSION_END

nodes:
  orchestrator_node: {events: [session, plan, precheck, subtask, hold]}
  detector_node:     {events: [config, check]}
  stt_node:          {events: [transcript]}
  # llm_node:        {events: [request, line, timing]}
  # tts_node:        {events: [say, prefetch]}
  # speaker_node:    {events: [playback]}
  # gui_bridge_node: {events: [client]}
