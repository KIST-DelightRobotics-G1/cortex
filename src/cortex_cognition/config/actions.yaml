# actions.yaml v2 — 열린 어휘. LLM 은 동사 20개(서명만)와 인자 형식만 배운다.
# 동사 설명(desc)·"가구로 move_to" 규칙은 절제 실험에서 효과가 없어 뺐다 (보고서 03절).
# 장소·물건 목록은 여기 없다 (실행 가능성은 capabilities.yaml 로 오케스트레이터가 판정).

actions:                      # KIST semantic action 표 20개 전부 활성화
  move_to:  {sig: [target],            exec: nav}
  open:     {sig: [object],            exec: vla}
  close:    {sig: [object],            exec: vla}
  pick:     {sig: [object],            exec: vla}
  place:    {sig: [object, target],    exec: vla}
  handover: {sig: [object, person],    exec: vla}
  take_out: {sig: [object, container], exec: vla}
  put_in:   {sig: [object, container], exec: vla}
  receive:  {sig: [object, person],    exec: vla}
  insert:   {sig: [object, target],    exec: vla}
  remove:   {sig: [object, target],    exec: vla}
  turn_on:  {sig: [device],            exec: vla}
  turn_off: {sig: [device],            exec: vla}
  adjust:   {sig: [target, state],     exec: vla}
  pour:     {sig: [source, target],    exec: vla}
  fill:     {sig: [container, substance], exec: vla}
  empty:    {sig: [container],         exec: vla}
  wipe:     {sig: [object],            exec: vla}
  lock:     {sig: [object],            exec: vla}
  unlock:   {sig: [object],            exec: vla}

action_ko: {move_to: 이동, open: 열기, close: 닫기, pick: 집기, place: 놓기, handover: 건네기,
            take_out: 꺼내기, put_in: 넣기, receive: 받기, insert: 끼우기, remove: 빼기,
            turn_on: 켜기, turn_off: 끄기, adjust: 조절, pour: 따르기, fill: 채우기,
            empty: 비우기, wipe: 닦기, lock: 잠그기, unlock: 잠금 해제}

# VLA 영어 지시문 템플릿. {0},{1} = 인자(밑줄→공백, 관사 the 붙임)
instruction:
  open:     "Open the {0}."
  close:    "Close the {0}."
  pick:     "Pick up the {0}."
  place:    "Place the {0} on the {1}."
  handover: "Hand the {0} to the {1}."
  take_out: "Take the {0} out of the {1}."
  put_in:   "Put the {0} into the {1}."
  receive:  "Receive the {0} from the {1}."
  insert:   "Insert the {0} into the {1}."
  remove:   "Remove the {0} from the {1}."
  turn_on:  "Turn on the {0}."
  turn_off: "Turn off the {0}."
  adjust:   "Adjust the {0} to {1}."
  pour:     "Pour from the {0} into the {1}."
  fill:     "Fill the {0} with {1}."
  empty:    "Empty the {0}."
  wipe:     "Wipe the {0}."
  lock:     "Lock the {0}."
  unlock:   "Unlock the {0}."

# 검출기 전제 확인: 어느 인자가 보여야 하는가
precheck:
  open: object
  close: object
  pick: object
  handover: person
  take_out: container
  put_in: container
  receive: person
  insert: target
  remove: object
  turn_on: device
  turn_off: device
  wipe: object
  lock: object
  unlock: object

phrases:
  ack:                "네."
  unknown_place:      "그곳은 아직 갈 수 없습니다."
  unsupported_action: "그 동작은 아직 할 수 없습니다."
  not_visible:        "{ko}{i} 보이지 않습니다."
  step_failed:        "{ko}{eul} 하지 못했습니다."
  not_accepted:       "{ko}{eul} 시작하지 못했습니다."
  module_lost:        "{ko} 모듈이 응답하지 않습니다."
  plan_error:         "죄송합니다. 잘 이해하지 못했습니다."
  stopped:            "멈춥니다."

# few-shot: 동사·물건·상황이 서로 다르고 테스트 발화와 겹치지 않는 6개
examples:
  - utterance: "책상에 있는 리모컨 좀 가져다줘"
    lines:
      - {i: 0, a: move_to,  args: [desk],                   say: "책상으로 갑니다."}
      - {i: 1, a: pick,     args: [remote_control],         say: "리모컨을 집습니다."}
      - {i: 2, a: move_to,  args: [user],                   say: "사용자에게 갑니다."}
      - {i: 3, a: handover, args: [remote_control, user],   say: "리모컨을 건네드립니다."}
  - utterance: "이 컵 찬장에 넣어줘"
    lines:
      - {i: 0, a: pick,    args: [cup],                 say: "컵을 집습니다."}
      - {i: 1, a: open,    args: [cupboard_door],       say: "찬장 문을 엽니다."}
      - {i: 2, a: put_in,  args: [cup, cupboard],       say: "컵을 찬장에 넣습니다."}
      - {i: 3, a: close,   args: [cupboard_door],       say: "찬장 문을 닫습니다."}
  - utterance: "선풍기 켜줘"
    lines:
      - {i: 0, a: turn_on, args: [fan], say: "선풍기를 켭니다."}
  - utterance: "주전자 물 컵에 따라줘"
    lines:
      - {i: 0, a: pour, args: [kettle, cup], say: "주전자 물을 컵에 따릅니다."}
  - utterance: "창문 좀 닦아"
    lines:
      - {i: 0, a: wipe, args: [window], say: "창문을 닦습니다."}
  - utterance: "노래 한 곡 불러줘"
    reply: {reply: none, say: "노래는 아직 못 합니다."}
  - utterance: "안녕"
    reply: {reply: chat, say: "안녕하세요. 무엇을 도와드릴까요?"}

limits:
  max_subtasks: 10

say_stems:
  move_to:  [갑니다, 이동, 향합니다]
  open:     [엽니다, 열]
  close:    [닫]
  pick:     [집, 듭니다]
  place:    [놓, 올려]
  handover: [건네, 드립니다, 전달]
  take_out: [꺼냅니다, 꺼내]
  put_in:   [넣]
  receive:  [받]
  insert:   [끼웁니다, 꽂]
  remove:   [뺍니다, 빼, 뽑]
  turn_on:  [켭니다, 켜]
  turn_off: [끕니다, 꺼]
  adjust:   [조절, 낮춥니다, 높입니다, 줄입니다, 키웁니다, 맞춥니다]
  pour:     [따릅니다, 따라, 붓]
  fill:     [채웁니다, 채워]
  empty:    [비웁니다, 비워]
  wipe:     [닦]
  lock:     [잠급니다, 잠가]
  unlock:   [풉니다, 해제, 엽니다]

promise_patterns: [드릴게요, 드리겠습니다, 가져올게요, 가져오겠습니다, 갈게요, 가겠습니다, 할게요, 하겠습니다]
